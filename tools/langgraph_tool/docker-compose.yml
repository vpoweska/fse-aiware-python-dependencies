version: "3.8"

services:
  langgraph-resolver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UNAME: ${USER:-appuser}
        UID:   ${UID:-1000}
        GID:   ${GID:-1000}
        DOCKER_GID: ${DOCKER_GID:-999}

    image: langgraph-resolver:latest
    container_name: langgraph-resolver
    privileged: true

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../hard-gists:/gists:ro
      - ../../pllm_results:/results:ro
      - ../../output/langgraph:/output

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock

    command: >
      --folder /gists
      -d /results
      -o /output
      -m gemma2
      -b http://172.18.0.1:11435
      -l 10
      --resume
